<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>愚者｜讓光走</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:#0c0c0a;color:#e8e4dc;font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 14px}
#intro{font-size:14px;text-align:center;color:rgba(232,228,220,.55);padding:10px 0 4px;min-height:2em;transition:opacity 1.6s}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#card{position:relative;overflow:hidden;border-radius:4px;touch-action:none;cursor:crosshair}
#card img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.dim{filter:brightness(.4) saturate(.75)}
.lit{filter:brightness(1.3) contrast(1.06);-webkit-mask-image:radial-gradient(circle var(--r,60px) at var(--x,-999px) var(--y,-999px),#000 0%,rgba(0,0,0,.85) 40%,transparent 100%);mask-image:radial-gradient(circle var(--r,60px) at var(--x,-999px) var(--y,-999px),#000 0%,rgba(0,0,0,.85) 40%,transparent 100%)}
#glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle var(--r,60px) at var(--x,-999px) var(--y,-999px),var(--g,rgba(255,216,64,.45)) 0%,transparent 100%)}
#panel{position:relative;height:clamp(13.5rem,31vh,19rem);flex:none;margin-bottom:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}#panel::-webkit-scrollbar{display:none}
#sentence{margin:0;padding:4px 2px;font-size:15.5px;line-height:1.95;font-weight:300;opacity:0;transition:opacity 1.1s ease}
.ln{display:block;margin-bottom:.3em}
.cl{opacity:0;transition:opacity 1.8s ease}
.cl.on{opacity:1}
.dots{opacity:0;transition:opacity 1.2s ease;margin-left:.15em}
.dots.on{opacity:.7}
.dots i{font-style:normal;display:inline-block;animation:dw 3.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.5s}
.dots i:nth-child(3){animation-delay:1s}
@keyframes dw{0%,100%{opacity:.15;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
</style>
</head>
<body>
<div id="app">
  <p id="intro">手指放在牌上，讓光走。</p>
  <div id="stage">
    <div id="card">
      <img class="dim" id="i1" alt="">
      <img class="lit" id="i2" alt="">
      <div id="glow"></div>
    </div>
  </div>
  <div id="panel"><p id="sentence"></p></div>
</div>

const $=id=>document.getElementById(id);
const card=$('card'),stage=$('stage'),panel=$('panel'),sent=$('sentence');
let cw=1,ch=1,lx=-999,ly=-999,cand=null,candT=0,cx0=0,cy0=0,shown=null,showT=0,fol=false,n=1,tm=null,started=false;

function fit(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  let w=sw,h=w/RATIO; if(h>sh){h=sh;w=h*RATIO;}
  cw=w;ch=h;card.style.width=w+'px';card.style.height=h+'px';
  card.style.setProperty('--r',Math.max(48,w*0.14)+'px');
}
function setLight(x,y){lx=x;ly=y;card.style.setProperty('--x',x+'px');card.style.setProperty('--y',y+'px');}
function onCard(e){
  const r=card.getBoundingClientRect();
  let x=e.clientX-r.left,y=e.clientY-r.top;
  if(e.pointerType==='touch')y-=56;
  setLight(x,y);
  if(!started){started=true;$('intro').style.opacity=0;}
}
card.addEventListener('pointerdown',e=>{try{card.setPointerCapture(e.pointerId);}catch(_){}onCard(e);});
card.addEventListener('pointermove',onCard);

const pm=[];let hid=false,offT=0,candSt=0,curSt=0,ckey=null;
function nearest(){
  let best=null,bd=1,md=9,rmin=9,rb=null,bs=0,rbs=0;
  LINES.forEach((L,i)=>L.a.forEach(a=>{
    let d=Math.hypot(lx-a[0]/100*cw,ly-a[1]/100*ch)/(Math.max(a[2],5.6)/100*cw);
    if(i===cand)d/=1.7;
    if(d<md)md=d;
    const rd=Math.hypot(lx-a[0]/100*cw,ly-a[1]/100*ch)/cw;if(rd<rmin){rmin=rd;rb=i;rbs=a[3]||0;}
    if(d<bd){bd=d;best=i;bs=a[3]||0;}
  }));
  if(best===null&&rmin<0.1){best=rb;bs=rbs;}
  candSt=bs;
  return best;
}
let timers=[],nextAt=1e15;
const gapFor=t=>600+75*t.length;
function addPara(t,more){
  const p=document.createElement('span');p.className='ln';
  const cls=t.match(/[^\uff0c\u3002\u3001\uff1b]+[\uff0c\u3002\u3001\uff1b]?/g)||[t];
  const sp=cls.map(c=>{const e=document.createElement('span');e.className='cl';e.textContent=c;p.appendChild(e);return e;});
  const old=sent.querySelector('.dots');
  if(old){old.classList.remove('on');setTimeout(()=>old.remove(),1200);}
  sent.appendChild(p);
  requestAnimationFrame(()=>panel.scrollTo({top:panel.scrollHeight,behavior:'smooth'}));
  const d=document.createElement('span');d.className='dots';d.innerHTML='<i>\u00b7</i><i>\u00b7</i><i>\u00b7</i>';
  let at=60,last=60;
  sp.forEach((e,k)=>{
    const t0=at;last=t0;
    timers.push(setTimeout(()=>e.classList.add('on'),t0));
    at+=1100+110*e.textContent.length;
  });
  if(more){const el=sp[sp.length-1];timers.push(setTimeout(()=>{el.after(d);requestAnimationFrame(()=>d.classList.add('on'));},last+1800));}
  return last+1800;
}
function show(i,st){
  st=st||0;
  pm[i]=pm[i]||{};curSt=st;shown=i;hid=false;offT=0;n=pm[i][st]||(st+1);showT=performance.now();nextAt=1e15;
  const had=sent.dataset.has;sent.dataset.has=1;
  sent.style.opacity=0;clearTimeout(tm);timers.forEach(clearTimeout);timers=[];
  tm=setTimeout(()=>{sent.innerHTML='';panel.scrollTop=0;sent.style.opacity=hid?0:1;const k=pm[i][st]||0;if(k>0){for(let q=st;q<k;q++){const p=document.createElement('span');p.className='ln';const e=document.createElement('span');e.className='cl on';e.textContent=LINES[i].s[q];p.appendChild(e);sent.appendChild(p);}requestAnimationFrame(()=>panel.scrollTo({top:panel.scrollHeight}));nextAt=k<LINES[i].s.length?performance.now()+1500:1e15;}else{pm[i][st]=st+1;nextAt=performance.now()+addPara(LINES[i].s[st],LINES[i].s.length>st+1)+gapFor(LINES[i].s[st]);}},had?1100:30);
}
function loop(now){
  const c=nearest();const key=c===null?null:c*10+candSt;
  if(key!==ckey){ckey=key;cand=c;candT=now;cx0=lx;cy0=ly;}
  else if(Math.hypot(lx-cx0,ly-cy0)>cw*0.1){candT=now;cx0=lx;cy0=ly;}
  if(cand!==null&&(cand!==shown||candSt!==curSt)&&now-candT>DWELL)show(cand,candSt);
  if(shown!==null){if(cand!==shown){if(!offT)offT=now;if(now-offT>500&&!hid){hid=true;sent.style.opacity=0;}}else{offT=0;if(hid){hid=false;sent.style.opacity=1;}}}
  if(shown!==null&&cand===shown&&n<LINES[shown].s.length&&now>nextAt){nextAt=1e15;const dur=addPara(LINES[shown].s[n],n+1<LINES[shown].s.length);nextAt=now+dur+gapFor(LINES[shown].s[n]);n++;pm[shown][curSt]=n;}
  requestAnimationFrame(loop);
}
window.addEventListener('resize',fit);
fit();requestAnimationFrame(loop);
</script>
<script>
/* 補光：光沒有落在任何光點裡時，讀最近的那一塊（只填空白，不改原本已對應的地方） */
(function(){
  const orig=nearest;
  nearest=function(){
    const r=orig();
    let bd=9,be=1e9,eb=null,es=0;
    LINES.forEach((L,i)=>L.a.forEach(a=>{
      const rd=Math.hypot(lx-a[0]/100*cw,ly-a[1]/100*ch),rr=a[2]/100*cw;
      const d=rd/rr;if(d<bd)bd=d;
      if(L.sky)return;
      const e=rd-rr;if(e<be){be=e;eb=i;es=a[3]||0;}
    }));
    if(bd<1)return r;
    if(eb!==null&&be<cw*0.1){try{candSt=es;}catch(_){}return eb;}
    return r;
  };
})();
</script>
