/* ── 以日期為種子，讓「今天」穩定出現同一組，直到主動再停駐 ── */
function hash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h) + str.charCodeAt(i); h = h & 0xffffffff; }
  return Math.abs(h);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function seededCard(seedExtra){
  const t = todayStr()+seedExtra;
  const img = IMAGES[hash(t+"i") % IMAGES.length];
  const quote = QUOTES[hash(t+"q") % QUOTES.length];
  return {img, quote};
}

let sessionOverride = null;

function renderHeader(){
  const d = new Date();
  document.getElementById("hdDate").textContent = (d.getMonth()+1)+" / "+d.getDate();
  const wk = ["週日","週一","週二","週三","週四","週五","週六"][d.getDay()];
  document.getElementById("hdWeekday").textContent = wk;
}

function reveal(forceNew){
  let card;
  if(forceNew){
    card = seededCard("-"+Math.random());
    sessionOverride = card;
  } else {
    card = sessionOverride || seededCard("");
  }
  document.getElementById("cardImg").src = card.img;
  document.getElementById("cardQuote").textContent = "\u201C"+card.quote[0]+"\u201D";
  document.getElementById("cardPoet").textContent = "— "+card.quote[1];

  document.getElementById("s0").classList.remove("active");
  document.getElementById("s1").classList.add("active");
  const wrap = document.getElementById("cardWrap");
  wrap.style.animation = "none";
  requestAnimationFrame(()=>{ wrap.style.animation = "rise .7s ease forwards"; });
}

document.getElementById("navToggle").addEventListener("click", ()=>{
  document.getElementById("navLinks").classList.toggle("open");
});

renderHeader();
